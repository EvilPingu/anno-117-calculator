server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html, the bundle, params.js and style.css keep their names across releases.
    # no-cache makes the browser revalidate (ETag -> 304 if unchanged) instead of
    # combining a fresh index.html with a stale bundle.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
